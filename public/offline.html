<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>No connection</title>
  <!-- Self-contained: it has to show with no network, no build files and no fonts. -->
  <style>
    :root { --purple: #6A0DAD; --ink: #1E0B33; --muted: #6B6B7E; --bg: #FAF8FC; --card: #fff; --line: #E2D9EE; }
    @media (prefers-color-scheme: dark) { :root { --ink: #F2F2F7; --muted: #A7A7B8; --bg: #121218; --card: #1C1C25; --line: #2A2A36; } }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 16px;
           background: var(--bg); color: var(--ink); font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
    main { max-width: 420px; width: 100%; background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 32px 26px; text-align: center; }
    .dot { width: 54px; height: 54px; border-radius: 50%; margin: 0 auto 16px; background: color-mix(in srgb, var(--purple) 12%, transparent);
           display: flex; align-items: center; justify-content: center; color: var(--purple); font-size: 26px; }
    h1 { font-size: 21px; margin: 0 0 8px; }
    p { color: var(--muted); margin: 0 0 20px; }
    button { font: inherit; font-weight: 600; padding: 11px 20px; border: 0; border-radius: 12px; background: var(--purple); color: #fff; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <div class="dot" aria-hidden="true">&#x21bb;</div>
    <h1>No connection</h1>
    <p>The app needs the internet to show your work. Nothing on this screen was lost; try again when you have signal.</p>
    <button onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
